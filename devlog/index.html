<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devlog - Vimonen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="../index.html" class="logo">← HOMEPAGE</a>
        </div>
    </nav>

    <main class="container">
        <div class="devlog-nav"></div>

        <article class="devlog-post">
            <h1 id="post-title">Ladataan...</h1>
            <small id="post-date"></small>
            <hr>
            <div id="post-content">
                </div>
        </article>

        <section class="devlog-archive-inline">
            <h3>Kaikki päivitykset</h3>
            <div id="inline-archive-list"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Vimonen. Nerd on.</p>
        </div>
    </footer>

    <script src="posts.js"></script>
    <script src="nav.js"></script>
    <script>
        async function _lataa_sisalto() {
            /**
             * Hakee postauksen tiedot URL-parametrin perusteella ja päivittää DOM-elementit.
             */
            const params = new URLSearchParams(window.location.search);
            let postId = params.get('id');
            
            let postData = postId 
                ? devlogPosts.find(p => p.id === postId || p.path.endsWith(postId))
                : devlogPosts[devlogPosts.length - 1];

            if (postData) {
                const tunnus = postData.id || postData.path.split('/').pop();
                
                document.getElementById('post-title').innerText = postData.title;
                document.getElementById('post-date').innerText = postData.date;
                
                try {
                    const response = await fetch(`content/${postData.path}.txt`);
                    if (!response.ok) throw new Error();
                    const text = await response.text();
                    
                    document.getElementById('post-content').innerHTML = text;
                    
                    // Päivitetään muut komponentit vasta kun sisältö on ladattu
                    _paivita_navigointi(devlogPosts, tunnus);
                    _paivita_inline_arkisto(tunnus);
                } catch (e) {
                    document.getElementById('post-content').innerText = "Virhe: Sisältöä ei löytynyt.";
                }
            }
        }

        function _paivita_inline_arkisto(nykyinenId) {
            /**
             * Rakentaa arkistolistan ja korostaa aktiivisen postauksen.
             */
            const list = document.getElementById("inline-archive-list");
            if (!list) return;
            list.innerHTML = "";
            
            [...devlogPosts].reverse().forEach(post => {
                const id = post.id || post.path.split('/').pop();
                const onNykyinen = id === nykyinenId;
                
                const item = document.createElement("div");
                item.className = `archive-row ${onNykyinen ? 'active' : ''}`;
                
                item.innerHTML = `
                    <span class="date">${post.date}</span>
                    <a href="index.html?id=${id}">${post.title}</a>
                `;
                list.appendChild(item);
            });
        }

        _lataa_sisalto();
    </script>
</body>
</html>
