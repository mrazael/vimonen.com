<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devlog - Vimonen</title>
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>
    <nav>
        <div class="container">
            <a href="../index.html" class="logo">VIMONEN</a>
        </div>
    </nav>

    <main class="container">
        <h1>Devlog Arkisto</h1>
        <div id="post-list" class="post-list"></div>
    </main>

    <script src="posts.js"></script>
    <script>
        const listElement = document.getElementById("post-list");
        
        /**
         * Luodaan arkistolista uusimmasta vanhimpaan.
         */
        const reversedPosts = [...devlogPosts].reverse();

        reversedPosts.forEach(post => {
            const article = document.createElement("article");
            article.innerHTML = `
                <a href="content/${post.path}"><h3>${post.title}</h3></a>
                <small>${post.date}</small>
                <hr>
            `;
            listElement.appendChild(article);
        });
    </script>
</body>
</html>
