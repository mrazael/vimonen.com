<article class="devlog-post">
            <h1 id="post-title">Ladataan...</h1>
            <small id="post-date"></small>
            <hr>
            <div id="post-content">
                </div>
        </article>

        <section class="devlog-archive-inline">
            <h3>Kaikki päivitykset</h3>
            <div id="inline-archive-list"></div>
        </section>
    </main>

    <script src="posts.js"></script>
    <script src="nav.js"></script>
    <script>
        async function _lataa_sisalto() {
            const params = new URLSearchParams(window.location.search);
            let postId = params.get('id');
            
            // Jos ID:tä ei ole, otetaan uusin
            let postData = postId 
                ? devlogPosts.find(p => p.id === postId || p.path.endsWith(postId))
                : devlogPosts[devlogPosts.length - 1];

            if (postData) {
                document.getElementById('post-title').innerText = postData.title;
                document.getElementById('post-date').innerText = postData.date;
                
                try {
                    const response = await fetch(`content/${postData.path}.txt`);
                    const text = await response.text();
                    document.getElementById('post-content').innerHTML = text;
                    
                    // Kun postaus on ladattu, päivitetään alla oleva arkistolista
                    _paivita_inline_arkisto(postData.id || postData.path.split('/').pop());
                } catch (e) {
                    document.getElementById('post-content').innerText = "Sisältöä ei löytynyt.";
                }
            }
        }

        function _paivita_inline_arkisto(currentId) {
            const list = document.getElementById("inline-archive-list");
            list.innerHTML = "";
            
            // Uusin ensin listassa
            [...devlogPosts].reverse().forEach(post => {
                const id = post.id || post.path.split('/').pop();
                const isCurrent = id === currentId;
                
                const item = document.createElement("div");
                item.className = `archive-row ${isCurrent ? 'active' : ''}`;
                
                item.innerHTML = `
                    <span class="indicator">${isCurrent ? '➔' : ''}</span>
                    <span class="date">${post.date}</span>
                    <a href="index.html?id=${id}">${post.title}</a>
                `;
                list.appendChild(item);
            });
        }
        _lataa_sisalto();
    </script>
