<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Devlog Archive - Vimonen</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="container">
        <a href="index.html">← Latest Post</a>
    </nav>
    <main class="container">
        <h1>Devlog Archive</h1>
        <div id="archive-list" class="post-list"></div>
    </main>

    <script src="posts.js"></script>
    <script>
        const listElement = document.getElementById("archive-list");
        // Show newest first in the archive
        const reversedPosts = [...devlogPosts].reverse();

        reversedPosts.forEach(post => {
            const article = document.createElement("article");
            article.style.marginBottom = "20px";
            article.innerHTML = `
                <small>${post.date}</small><br>
                <a href="content/${post.path}" style="font-size: 1.2rem; font-weight: bold;">${post.title}</a>
                <hr style="border: 0; border-top: 1px solid #334155; margin-top: 10px;">
            `;
            listElement.appendChild(article);
        });
    </script>
</body>
</html>
